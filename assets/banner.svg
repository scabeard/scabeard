<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dripPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2fd0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2fd0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dripPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9d4bff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9d4bff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9d4bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="#000000"/>

  <!-- neon rain drips -->
  <g filter="url(#glow)">
    <rect x="40" y="-100" width="3" height="90" fill="url(#dripPink)">
      <animate attributeName="y" from="-100" to="260" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="-140" width="2" height="70" fill="url(#dripPurple)">
      <animate attributeName="y" from="-140" to="260" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="-80" width="3" height="100" fill="url(#dripPink)">
      <animate attributeName="y" from="-80" to="260" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="-160" width="2" height="60" fill="url(#dripPurple)">
      <animate attributeName="y" from="-160" to="260" dur="3.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="-60" width="2" height="80" fill="url(#dripPurple)">
      <animate attributeName="y" from="-60" to="260" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="650" y="-90" width="3" height="90" fill="url(#dripPink)">
      <animate attributeName="y" from="-90" to="260" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="730" y="-130" width="2" height="70" fill="url(#dripPurple)">
      <animate attributeName="y" from="-130" to="260" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="820" y="-70" width="3" height="100" fill="url(#dripPink)">
      <animate attributeName="y" from="-70" to="260" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="900" y="-150" width="2" height="60" fill="url(#dripPurple)">
      <animate attributeName="y" from="-150" to="260" dur="4.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="960" y="-100" width="2" height="80" fill="url(#dripPink)">
      <animate attributeName="y" from="-100" to="260" dur="3.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulsing green terminal text -->
  <text x="500" y="120" text-anchor="middle" font-family="Courier New, monospace" font-size="44" fill="#39ff14" filter="url(#glowStrong)">
    &gt;_ scabeard
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="160" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#39ff14" opacity="0.8">
    security-minded developer // stonecodelab.com
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- scanline flicker -->
  <rect x="0" y="0" width="1000" height="260" fill="#39ff14" opacity="0">
    <animate attributeName="opacity" values="0;0.02;0" dur="0.15s" repeatCount="indefinite"/>
  </rect>
</svg>
